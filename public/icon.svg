<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="woodBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#ebd2aa" />
      <stop offset="60%" stopColor="#dfc090" />
      <stop offset="100%" stopColor="#ab7b45" />
    </radialGradient>
    <linearGradient id="boardFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#6e421c" />
      <stop offset="50%" stopColor="#4e2c10" />
      <stop offset="100%" stopColor="#2c1605" />
    </linearGradient>
    <radialGradient id="goldDice" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stopColor="#fff6c8" />
      <stop offset="45%" stopColor="#f3c545" />
      <stop offset="85%" stopColor="#c58a18" />
      <stop offset="100%" stopColor="#875604" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1f1005" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#woodBg)" />

  <!-- Ludo Board Frame -->
  <g filter="url(#dropShadow)">
    <rect x="56" y="56" width="400" height="400" rx="44" fill="url(#boardFrame)" stroke="#caa052" stroke-width="6" />
    <rect x="76" y="76" width="360" height="360" rx="28" fill="#faf2df" />

    <!-- 4 Colored Quadrants -->
    <rect x="76" y="76" width="140" height="140" rx="28" fill="#1e5aa8" />
    <rect x="296" y="76" width="140" height="140" rx="28" fill="#e2a316" />
    <rect x="76" y="296" width="140" height="140" rx="28" fill="#c82e29" />
    <rect x="296" y="296" width="140" height="140" rx="28" fill="#267d39" />

    <!-- Inner Base Rings -->
    <circle cx="146" cy="146" r="44" fill="#fcf5e3" stroke="#3b2313" stroke-width="4" />
    <circle cx="366" cy="146" r="44" fill="#fcf5e3" stroke="#3b2313" stroke-width="4" />
    <circle cx="146" cy="366" r="44" fill="#fcf5e3" stroke="#3b2313" stroke-width="4" />
    <circle cx="366" cy="366" r="44" fill="#fcf5e3" stroke="#3b2313" stroke-width="4" />

    <!-- Base Token Pegs -->
    <circle cx="146" cy="146" r="22" fill="#1e5aa8" />
    <circle cx="366" cy="146" r="22" fill="#e2a316" />
    <circle cx="146" cy="366" r="22" fill="#c82e29" />
    <circle cx="366" cy="366" r="22" fill="#267d39" />

    <!-- Center Dice Plinth -->
    <rect x="206" y="206" width="100" height="100" rx="22" fill="url(#goldDice)" stroke="#5c381c" stroke-width="5" />
    <!-- Center Dice Pips (Six) -->
    <circle cx="232" cy="228" r="7" fill="#382005" />
    <circle cx="232" cy="256" r="7" fill="#382005" />
    <circle cx="232" cy="284" r="7" fill="#382005" />
    <circle cx="280" cy="228" r="7" fill="#382005" />
    <circle cx="280" cy="256" r="7" fill="#382005" />
    <circle cx="280" cy="284" r="7" fill="#382005" />
  </g>
</svg>

